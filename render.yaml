# Render Blueprint for the always-on realtime server (Socket.IO + Yjs).
#
# Netlify serves the site + API; this small service powers the live features
# (chat, 10-min/1-day critiques, the 6-writer game). After it deploys, set
# NEXT_PUBLIC_REALTIME_URL in Netlify to this service's URL and redeploy the
# site. The realtime pages will then connect here instead of showing the
# "needs a live server" notice.
services:
  - type: web
    name: writers-workshop-realtime
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npm run realtime
    healthCheckPath: /healthz
    envVars:
      - key: REALTIME_ONLY
        value: "1"
      - key: NODE_ENV
        value: production
      # Set these two in the Render dashboard (marked secret):
      #   DATABASE_URL  = the pooled Neon URL (same as Netlify)
      #   APP_BASE_URL  = your Netlify site URL (for the socket CORS allowlist)
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
